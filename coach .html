<!DOCTYPE html>

<title>Espace coach - Arras Football</title>
<style>
  * { box-sizing: border-box; }

  }
  select:focus {

  }
  .question {
    margin-bottom: 28px;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  input[type="range"] {
    flex: 1;
    height: 40px;
    -webkit-appearance: none;
    appearance: none;

  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 8px;
    background: #4a5a85;
    border-radius: 4px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;

    width: 34px;

    border-radius: 50%;
    background: var(--rouge);

  }
  input[type="range"]::-moz-range-track {
    height: 8px;
    background: #4a5a85;

  }
  input[type="range"]::-moz-range-thumb {
    width: 34px;
    height: 34px;

  .value-badge {

  .scale-labels {

  }
  button#submitBtn {

  button#submitBtn:active { background: #a10c24; }
  .confirmation {

  .admin {
    max-width: 480px;

  }
  .admin button {
    background: rgba(255,255,255,0.12);

    color: #fff;

  .admin-panel {
    display: none;

  .admin-panel h2 {
    color: var(--or);

  }
  .admin-panel label {

  }
  .login-row {

  .login-row input {

    padding: 14px;

  .login-row input:focus {

  #loginBtn {
    width: 100%;

    text-transform: uppercase;

  }
  #loginBtn:active { background: #a10c24; }
  .role-badge {
    display: block;
    text-align: center;
    background: var(--or);

    font-size: 13px;

  .cat-filter {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 2px solid var(--or);
    font-size: 15px;
    margin-bottom: 14px;
    background: #fff;
    color: #1a1a1a;
  }
  .count-line {
    color: #fff;
    font-size: 14px;
    margin-bottom: 14px;
    display: block;
  }
  .count-line strong { color: var(--or); font-size: 16px; }
  .player-block {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .player-block h3 {
    margin: 0 0 10px;
    color: var(--bleu);
    font-size: 16px;
    font-weight: 800;
    border-bottom: 2px solid var(--or);

  }
  .player-block table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .player-block th {
    background: var(--bleu);
    color: #fff;
    padding: 8px 5px;
    text-align: center;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .player-block th:first-child {
    text-align: left;
  }
  .player-block td {
    padding: 9px 5px;
    text-align: center;
    font-weight: 700;
    border-bottom: 2px solid #fff;
  }
  .player-block td:first-child {
    text-align: left;
    font-weight: 500;
    color: #444;
    font-size: 11px;
  }
  .admin-panel button.action {
    padding: 12px 16px;
    background: var(--bleu);
    color: #fff;
    border: 2px solid var(--or);
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    margin: 12px 8px 0 0;
    cursor: pointer;
  }
  .error-msg {
    color: #ff6b6b;
    font-size: 13px;
    margin: 8px 0 0;
    text-align: center;
    font-weight: 600;
  }
  .loading-msg {
    color: var(--or);
    text-align: center;
    font-size: 14px;
    padding: 10px 0;
  }
  .cat-btn {
    padding: 16px 22px;
    font-size: 16px;
    font-weight: 800;
    background: rgba(255,255,255,0.1);
    border: 2px solid var(--or);
    color: #fff;
    border-radius: 12px;
    cursor: pointer;
    min-width: 90px;
  }
  .cat-btn:active { background: var(--or); color: var(--bleu); }
  .back-btn {
    background: none;
    border: none;
    color: var(--or);
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 14px;
    cursor: pointer;
    padding: 6px 0;
  }
  .alert-section {
    margin-bottom: 16px;
  }
  .alert-title {
    color: #fff;
    font-size: 12.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .alert-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 6px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
  }
  .alert-row.critique {
    background: #dc2626;
    color: #fff;
  }
  .alert-row.mauvais {
    background: #f97316;
    color: #fff;
  }
  .alert-row.absent {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px dashed var(--or);
  }
  .alert-row .alert-tag {
    font-size: 11px;
    font-weight: 600;
    opacity: 0.9;
  }
  .no-alert-msg {
    color: #a9b8d6;
    font-size: 13px;
    text-align: center;
    padding: 6px 0 14px;
  }
  .player-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    padding: 14px 16px;
    border-radius: 10px;

    cursor: pointer;
  }
  .player-row:active { background: #eee; }
  .player-row .pname {
    font-weight: 700;
    color: var(--bleu);
    font-size: 15px;
  }
  .player-row .pcount {
    font-size: 12px;
    color: #777;
  }
  .player-row .parrow {
    color: var(--or);
    font-weight: 800;
    font-size: 18px;
  }
  .del-btn {
    background: #dc2626;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 11px;
    cursor: pointer;
  }
</style>

<body>

<div class="banner">
  <div class="logo-wrap">
    <img src="logo-banniere.png" alt="Logo Arras Football">
  </div>
  <div class="banner-text">
    <div class="club">ARRAS FOOTBALL</div>
    <div class="section">Section sportive football Denis Diderot</div>
  </div>
</div>

<div class="card">
  <h2 style="color:var(--or); text-transform:uppercase; text-align:center; letter-spacing:0.5px; margin:0 0 20px; font-size:20px;">Espace coach</h2>

  <div id="loginBox">
    <label>Email</label>
    <div class="login-row">
      <input type="email" id="coachEmail" placeholder="email@exemple.fr">
    </div>
    <label>Mot de passe</label>
    <div class="login-row">
      <input type="password" id="coachPassword" placeholder="Mot de passe">
    </div>
    <button id="loginBtn">Se connecter</button>
    <div class="error-msg" id="loginError"></div>
  </div>

  <div id="dashboardBox" style="display:none;">
    <div id="roleBadge" class="role-badge"></div>

    <div id="screenCategory">
      <p style="color:#fff; text-align:center; margin-bottom:14px;">Choisis une catégorie</p>
      <div id="categoryButtons" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center;"></div>
    </div>

    <div id="screenPlayers" style="display:none;">
      <button class="back-btn" id="backToCategory">← Catégories</button>
      <span class="count-line">Joueurs — <strong id="catLabel"></strong></span>
      <div id="alertsBox"></div>
      <div id="playersList"></div>
      <button class="action" id="exportBtn">📥 Exporter en CSV</button>
    </div>

    <div id="screenPlayerDetail" style="display:none;">
      <button class="back-btn" id="backToPlayers">← Liste des joueurs</button>
      <div id="playerTableWrap"></div>
    </div>

    <button class="action" id="logoutBtn" style="background:#555; border-color:#888; margin-top:16px;">Déconnexion</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  const SUPABASE_URL = 'https://qcfazoubxeudaknsefqo.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_VK1WsNSkEBDOxtV075PkSQ_PswJ0HF9';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let currentRole = null;
  let currentCategorie = null;
  let currentData = [];

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('coachEmail').value.trim();
    const password = document.getElementById('coachPassword').value;
    const errBox = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');
    errBox.textContent = '';

    if (!email || !password) {
      errBox.textContent = 'Renseigne ton email et ton mot de passe.';
      return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = 'Connexion...';

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      loginBtn.disabled = false;
      loginBtn.textContent = 'Se connecter';
      errBox.textContent = 'Connexion refusée : identifiants incorrects.';
      return;
    }

    const { data: profil, error: profilErr } = await sb
      .from('profils_coachs')
      .select('categorie, role')
      .eq('id', data.user.id)
      .single();

    loginBtn.disabled = false;
    loginBtn.textContent = 'Se connecter';

    if (profilErr || !profil) {
      errBox.textContent = "Compte connecté mais aucun profil coach associé.";
      await sb.auth.signOut();
      return;
    }

    currentRole = profil.role;
    currentCategorie = profil.categorie;

    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboardBox').style.display = 'block';
    document.getElementById('roleBadge').textContent = profil.role === 'admin' ? 'ADMIN — accès complet' : 'COACH ' + profil.categorie;

    showCategoryScreen();
  });

  const TOUTES_CATEGORIES = ['U12', 'U13', 'U14', 'U15'];

  function showCategoryScreen() {
    document.getElementById('screenCategory').style.display = 'block';
    document.getElementById('screenPlayers').style.display = 'none';
    document.getElementById('screenPlayerDetail').style.display = 'none';

    const cats = currentRole === 'admin' ? TOUTES_CATEGORIES : [currentCategorie];
    const wrap = document.getElementById('categoryButtons');
    wrap.innerHTML = '';
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.textContent = cat;
      btn.addEventListener('click', () => selectCategorie(cat));
      wrap.appendChild(btn);
    });
  }

  let categoryData = [];
  let selectedCategorie = null;
  let selectedPrenom = null;

  async function selectCategorie(cat) {
    selectedCategorie = cat;
    document.getElementById('screenCategory').style.display = 'none';
    document.getElementById('screenPlayers').style.display = 'block';
    document.getElementById('catLabel').textContent = cat;
    document.getElementById('playersList').innerHTML = '<p class="loading-msg">Chargement...</p>';

    const { data, error } = await sb
      .from('reponses')
      .select('*')
      .eq('categorie', cat)
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('playersList').innerHTML = '<p class="error-msg">Erreur : ' + error.message + '</p>';
      return;
    }
    categoryData = data || [];
    renderPlayersList();
  }

  function renderPlayersList() {
    renderAlerts();
    if (categoryData.length === 0) {
      document.getElementById('playersList').innerHTML = '<p style="color:#a9b8d6; text-align:center; padding:10px 0;">Aucune réponse pour le moment.</p>';
      return;
    }
    const counts = {};
    categoryData.forEach(r => { counts[r.prenom] = (counts[r.prenom] || 0) + 1; });

    let html = '';
    Object.keys(counts).sort().forEach(prenom => {
      html += `<div class="player-row" data-prenom="${prenom}">
        <div>
          <div class="pname">${prenom}</div>
          <div class="pcount">${counts[prenom]} réponse${counts[prenom] > 1 ? 's' : ''}</div>
        </div>
        <div class="parrow">›</div>
      </div>`;
    });
    document.getElementById('playersList').innerHTML = html;

    document.querySelectorAll('.player-row').forEach(row => {
      row.addEventListener('click', () => selectPlayer(row.dataset.prenom));
    });
  }

  function renderAlerts() {
    const alertsBox = document.getElementById('alertsBox');
    if (categoryData.length === 0) { alertsBox.innerHTML = ''; return; }

    const groups = {};
    categoryData.forEach(r => {
      if (!groups[r.prenom]) groups[r.prenom] = [];
      groups[r.prenom].push(r);
    });

    const todayStr = new Date().toDateString();
    const badList = [];
    const missingList = [];

    Object.keys(groups).forEach(prenom => {
      const entries = groups[prenom]; // déjà triées du plus récent au plus ancien
      const latest = entries[0];
      const sommeilInverse = 8 - latest.sommeil;
      const total = sommeilInverse + latest.courbatures + latest.fatigue + latest.stress;
      const info = totalInfo(total);
      if (info.label === 'Très mauvais' || info.label === 'Mauvais') {
        badList.push({ prenom, label: info.label, cls: info.label === 'Très mauvais' ? 'critique' : 'mauvais' });
      }
      const hasToday = entries.some(e => new Date(e.created_at).toDateString() === todayStr);
      if (!hasToday) missingList.push(prenom);
    });

    badList.sort((a, b) => (a.cls === 'critique' ? 0 : 1) - (b.cls === 'critique' ? 0 : 1));

    let html = '';
    if (badList.length > 0) {
      html += '<div class="alert-section"><div class="alert-title">⚠️ État préoccupant</div>';
      badList.forEach(b => {
        html += `<div class="alert-row ${b.cls}" data-prenom="${b.prenom}"><span>${b.prenom}</span><span class="alert-tag">${b.label}</span></div>`;
      });
      html += '</div>';
    }
    if (missingList.length > 0) {
      html += '<div class="alert-section"><div class="alert-title">🕓 N\'ont pas répondu aujourd\'hui</div>';
      missingList.sort().forEach(p => {
        html += `<div class="alert-row absent" data-prenom="${p}"><span>${p}</span><span class="alert-tag">Absent</span></div>`;
      });
      html += '</div>';
    }
    if (badList.length === 0 && missingList.length === 0) {
      html = '<p class="no-alert-msg">✓ Aucune alerte — tout va bien.</p>';
    }
    alertsBox.innerHTML = html;

    document.querySelectorAll('.alert-row').forEach(row => {
      row.addEventListener('click', () => selectPlayer(row.dataset.prenom));
    });
  }

  function cellColor(v) {
    if (v >= 6) return { bg: '#dc2626', fg: '#fff' };
    if (v === 5) return { bg: '#f97316', fg: '#fff' };
    if (v === 4) return { bg: '#2563eb', fg: '#fff' };
    if (v === 3) return { bg: '#eab308', fg: '#1a1a1a' };
    return { bg: '#86efac', fg: '#1a1a1a' }; // 1 ou 2
  }

  function totalInfo(total) {
    if (total < 8) return { bg: '#86efac', fg: '#1a1a1a', label: 'Excellent' };
    if (total < 16) return { bg: '#eab308', fg: '#1a1a1a', label: 'Bon' };
    if (total < 20) return { bg: '#2563eb', fg: '#fff', label: 'Moyen' };
    if (total < 24) return { bg: '#f97316', fg: '#fff', label: 'Mauvais' };
    return { bg: '#dc2626', fg: '#fff', label: 'Très mauvais' };
  }

  function selectPlayer(prenom) {
    selectedPrenom = prenom;
    document.getElementById('screenPlayers').style.display = 'none';
    document.getElementById('screenPlayerDetail').style.display = 'block';
    renderPlayerDetail();
  }

  function renderPlayerDetail() {
    const rows = categoryData.filter(r => r.prenom === selectedPrenom);
    let html = `<div class="player-block"><h3>${selectedPrenom} (${selectedCategorie})</h3><table>`;
    html += '<tr><th>Date</th><th>Sommeil</th><th>Courb.</th><th>Fatigue</th><th>Stress</th><th>Total</th><th>État</th><th></th></tr>';
    rows.forEach(r => {
      const d = new Date(r.created_at).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      const sommeilInverse = 8 - r.sommeil;
      const total = sommeilInverse + r.courbatures + r.fatigue + r.stress;
      const tInfo = totalInfo(total);
      const c1 = cellColor(8 - r.sommeil), c2 = cellColor(r.courbatures), c3 = cellColor(r.fatigue), c4 = cellColor(r.stress);
      html += `<tr>
        <td>${d}</td>
        <td style="background:${c1.bg}; color:${c1.fg};">${r.sommeil}</td>
        <td style="background:${c2.bg}; color:${c2.fg};">${r.courbatures}</td>
        <td style="background:${c3.bg}; color:${c3.fg};">${r.fatigue}</td>
        <td style="background:${c4.bg}; color:${c4.fg};">${r.stress}</td>
        <td style="background:${tInfo.bg}; color:${tInfo.fg};">${total}</td>
        <td style="background:${tInfo.bg}; color:${tInfo.fg}; font-size:11px;">${tInfo.label}</td>
        <td><button class="del-btn" data-id="${r.id}">✕</button></td>
      </tr>`;
    });
    html += '</table></div>';
    document.getElementById('playerTableWrap').innerHTML = html;

    document.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => deleteResponse(btn.dataset.id));
    });
  }

  async function deleteResponse(id) {
    if (!confirm('Supprimer définitivement cette réponse ?')) return;
    const { error } = await sb.from('reponses').delete().eq('id', id);
    if (error) {
      alert('Erreur suppression : ' + error.message);
      return;
    }
    categoryData = categoryData.filter(r => String(r.id) !== String(id));
    renderPlayerDetail();
    // Si plus aucune réponse pour ce joueur, revenir à la liste
    if (categoryData.filter(r => r.prenom === selectedPrenom).length === 0) {
      backToPlayersScreen();
    }
  }

  function backToPlayersScreen() {
    document.getElementById('screenPlayerDetail').style.display = 'none';
    document.getElementById('screenPlayers').style.display = 'block';
    renderPlayersList();
  }

  document.getElementById('backToCategory').addEventListener('click', showCategoryScreen);
  document.getElementById('backToPlayers').addEventListener('click', backToPlayersScreen);

  document.getElementById('exportBtn').addEventListener('click', () => {
    if (categoryData.length === 0) { alert('Aucune réponse à exporter.'); return; }
    let csv = 'Date;Prenom;Categorie;Sommeil;Courbatures;Fatigue;Stress;Total;Etat\n';
    categoryData.forEach(r => {
      const d = new Date(r.created_at).toLocaleString('fr-FR');
      const total = (8 - r.sommeil) + r.courbatures + r.fatigue + r.stress;
      const label = totalInfo(total).label;
      csv += `${d};${r.prenom};${r.categorie};${r.sommeil};${r.courbatures};${r.fatigue};${r.stress};${total};${label}\n`;
    });
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'reponses_' + selectedCategorie + '_' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    currentRole = null;
    currentCategorie = null;
    categoryData = [];
    selectedCategorie = null;
    selectedPrenom = null;
    document.getElementById('dashboardBox').style.display = 'none';
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('coachEmail').value = '';
    document.getElementById('coachPassword').value = '';
  });
</script>

</body>
</html>
